<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111613">
  <title>Word Puzzle | Web For All</title>

  <script src="../js/theme-init.js"></script>

  <link rel="stylesheet" href="../css/main.css">

  <script src="../js/utils.js" defer></script>
  <script src="../js/translations.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <script src="../js/speech.js" defer></script>
  <script src="../js/layout.js" defer></script>
  <script src="../js/puzzle.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>

<body>
  <main id="main">
    <section class="hero solo one word-puzzle-container">
      <div>
        <a class="link back-to-accessibility-guide-page-button" href="guide.html" data-fil="← Bumalik sa Gabay">← Back to the guide</a>
        <h1 id="title" style="margin-top:1.5rem" data-fil="Word Puzzle">Word Puzzle</h1>
        <h3 id="instructions" style="margin-top:.8rem" data-fil="Hulaan ang tamang salita tungkol sa accessibility!">Guess the correct accessibility word!</h3>
        <p class="lead" data-fil="Hulaan ang salitang may 5 letra sa loob ng 6 na subok. Berde: tama. Dilaw: nasa salita pero mali ang pwesto. Abo: wala sa salita.">Guess the 5-letter word in 6 tries. Green means correct, yellow means the letter is in the word, gray means it is not.</p>
      </div>
    </section>
    <section class="word-puzzle-container">
      <p id="hint" class="hint"></p>
      <div id="board"></div>
      <h2 id="answer" role="status" aria-live="polite"></h2>
      <div id="kb"></div>
    </section>
  </main>
</body>
</html>
